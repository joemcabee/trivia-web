name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.DOCKER_SERVER }}
        username: ${{ vars.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PW }}

    - name: Build and push Back-End image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/arm64
        push: true
        tags: ${{ vars.DOCKER_SERVER }}/slacker-trivia-web-be:latest
        cache-from: type=gha,scope=backend
        cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.DOCKER_SERVER }}
        username: ${{ vars.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PW }}

    - name: Build and push Front-End image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        platforms: linux/arm64
        push: true
        tags: ${{ vars.DOCKER_SERVER }}/slacker-trivia-web-fe:latest
        build-args: |
          VITE_API_URL=https://trivia-api.slackersoftware.com/api
          VITE_OIDC_AUTHORITY=https://auth.slackersoftware.com/realms/slacker-prd
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend
